<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股估值模型</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1d23;
    color: #e0e6f0;
    font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    min-height: 100vh;
    padding: 24px;
  }

  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    color: #7eb8f7;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }

  /* ── 輸入區 ── */
  .input-section {
    background: #23273a;
    border: 1px solid #2e3451;
    border-radius: 10px;
    padding: 20px 24px;
    margin-bottom: 24px;
  }

  .input-section h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #6b7a99;
    margin-bottom: 14px;
  }

  .input-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }

  .field label {
    display: block;
    font-size: 0.72rem;
    color: #7a8aaa;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }

  .field input {
    width: 100%;
    background: #1a1d23;
    border: 1px solid #3a4060;
    border-radius: 6px;
    padding: 8px 10px;
    color: #e0e6f0;
    font-size: 0.92rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .field input:focus { border-color: #5a7fcb; }

  .calc-btn {
    margin-top: 16px;
    background: #3d5fa8;
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 10px 28px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    letter-spacing: 0.5px;
  }

  .calc-btn:hover { background: #4f75c8; }

  /* ── 倍數編輯區 ── */
  .levels-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }

  @media (max-width: 640px) { .levels-wrapper { grid-template-columns: 1fr; } }

  .levels-section {
    background: #23273a;
    border: 1px solid #2e3451;
    border-radius: 10px;
    padding: 18px 20px;
  }

  .levels-section h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #6b7a99;
    margin-bottom: 12px;
  }

  .levels-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  .levels-table th {
    color: #6b7a99;
    font-weight: 500;
    font-size: 0.72rem;
    text-align: left;
    padding: 4px 6px 8px;
    border-bottom: 1px solid #2e3451;
  }

  .levels-table td { padding: 4px 6px; }

  .levels-table td:first-child {
    color: #7eb8f7;
    font-weight: 600;
    width: 50px;
  }

  .levels-table input[type="number"] {
    width: 80px;
    background: #1a1d23;
    border: 1px solid #3a4060;
    border-radius: 5px;
    padding: 5px 8px;
    color: #e0e6f0;
    font-size: 0.85rem;
    outline: none;
  }

  .levels-table input[type="number"]:focus { border-color: #5a7fcb; }

  .remove-btn {
    background: none;
    border: none;
    color: #555e7a;
    cursor: pointer;
    font-size: 1rem;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.2s;
  }

  .remove-btn:hover { color: #e05555; }

  .add-btn {
    margin-top: 10px;
    background: none;
    border: 1px dashed #3a4060;
    color: #6b7a99;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 0.8rem;
    cursor: pointer;
    width: 100%;
    transition: border-color 0.2s, color 0.2s;
  }

  .add-btn:hover { border-color: #5a7fcb; color: #7eb8f7; }

  /* ── 結果區 ── */
  .results-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 640px) { .results-wrapper { grid-template-columns: 1fr; } }

  .result-card {
    background: #23273a;
    border: 1px solid #2e3451;
    border-radius: 10px;
    overflow: hidden;
  }

  .result-header {
    background: #1e2235;
    padding: 12px 18px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .result-header .ticker {
    font-size: 1rem;
    font-weight: 700;
    color: #7eb8f7;
  }

  .result-header .name {
    font-size: 0.9rem;
    color: #a0aac0;
  }

  .result-header .metric {
    margin-left: auto;
    font-size: 0.75rem;
    color: #6b7a99;
  }

  .result-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.875rem;
  }

  .result-table th {
    background: #1e2235;
    color: #6b7a99;
    font-weight: 500;
    font-size: 0.72rem;
    text-align: right;
    padding: 8px 16px;
    border-bottom: 1px solid #2e3451;
    letter-spacing: 0.5px;
  }

  .result-table th:first-child { text-align: left; }

  .result-table td {
    padding: 9px 16px;
    text-align: right;
    border-bottom: 1px solid #1e2235;
  }

  .result-table td:first-child {
    text-align: left;
    color: #7eb8f7;
    font-weight: 600;
  }

  .result-table td:nth-child(2) { color: #a0aac0; }

  .result-table tr:last-child td { border-bottom: none; }

  /* highlight current price row */
  .result-table tr.current-row td { background: #1f2840; }

  /* color for pct */
  .pct-neg  { color: #e05555 !important; }
  .pct-low  { color: #d4a03a !important; }
  .pct-high { color: #3cb97a !important; }

  .empty-msg {
    text-align: center;
    color: #4a5470;
    font-size: 0.85rem;
    padding: 40px 0;
  }

  /* ── 股票代號自動帶入狀態 ── */
  .ticker-wrap { position: relative; }

  .ticker-status {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.75rem;
    pointer-events: none;
    white-space: nowrap;
  }

  .ticker-status.loading { color: #6b7a99; }
  .ticker-status.ok      { color: #3cb97a; }
  .ticker-status.error   { color: #e05555; }

  .ticker-wrap input { padding-right: 60px; }
</style>
</head>
<body>

<h1>台股估值模型</h1>

<!-- 基本資料輸入 -->
<div class="input-section">
  <h2>基本資料</h2>
  <div class="input-grid">
    <div class="field">
      <label>股票代號</label>
      <div class="ticker-wrap">
        <input id="ticker" type="text" value="2049" placeholder="e.g. 2049" autocomplete="off">
        <span id="tickerStatus" class="ticker-status"></span>
      </div>
    </div>
    <div class="field">
      <label>股票名稱</label>
      <input id="stockName" type="text" value="上銀" placeholder="e.g. 上銀">
    </div>
    <div class="field">
      <label>現價（元）</label>
      <input id="currentPrice" type="number" step="0.01" value="364.50" placeholder="364.50">
    </div>
    <div class="field">
      <label>每股淨值 BVPS（元）</label>
      <input id="bvps" type="number" step="0.01" value="303.90" placeholder="303.90">
    </div>
    <div class="field">
      <label>每股盈餘 EPS（元）</label>
      <input id="eps" type="number" step="0.01" value="15.20" placeholder="15.20">
    </div>
  </div>
  <button class="calc-btn" onclick="calculate()">計算目標價</button>
</div>

<!-- 倍數設定 -->
<div class="levels-wrapper">
  <div class="levels-section">
    <h2>P/B 倍數設定</h2>
    <table class="levels-table">
      <thead>
        <tr><th>層級</th><th>倍數 (x)</th><th></th></tr>
      </thead>
      <tbody id="pbLevels"></tbody>
    </table>
    <button class="add-btn" onclick="addLevel('pb')">＋ 新增層級</button>
  </div>
  <div class="levels-section">
    <h2>P/E 倍數設定</h2>
    <table class="levels-table">
      <thead>
        <tr><th>層級</th><th>倍數 (x)</th><th></th></tr>
      </thead>
      <tbody id="peLevels"></tbody>
    </table>
    <button class="add-btn" onclick="addLevel('pe')">＋ 新增層級</button>
  </div>
</div>

<!-- 結果 -->
<div class="results-wrapper">
  <div class="result-card">
    <div class="result-header">
      <span class="ticker" id="res-ticker-pb">—</span>
      <span class="name" id="res-name-pb">—</span>
      <span class="metric" id="res-metric-pb">P/B</span>
    </div>
    <div id="res-pb"><p class="empty-msg">請輸入資料後按下「計算目標價」</p></div>
  </div>
  <div class="result-card">
    <div class="result-header">
      <span class="ticker" id="res-ticker-pe">—</span>
      <span class="name" id="res-name-pe">—</span>
      <span class="metric" id="res-metric-pe">P/E</span>
    </div>
    <div id="res-pe"><p class="empty-msg">請輸入資料後按下「計算目標價」</p></div>
  </div>
</div>

<script>
  // ── 預設倍數 ─────────────────────────────
  const DEFAULT_PB = [
    { label: "L1",  value: 0.8 },
    { label: "L2",  value: 1.0 },
    { label: "L3",  value: 1.2 },
    { label: "L4",  value: 1.5 },
    { label: "L5",  value: 2.0 },
    { label: "L6",  value: 2.5 },
    { label: "L7",  value: 3.0 },
    { label: "L10", value: 4.0 },
  ];

  const DEFAULT_PE = [
    { label: "L1",  value: 10 },
    { label: "L2",  value: 15 },
    { label: "L3",  value: 20 },
    { label: "L4",  value: 25 },
    { label: "L5",  value: 30 },
    { label: "L6",  value: 35 },
    { label: "L7",  value: 40 },
    { label: "L10", value: 50 },
  ];
  // ─────────────────────────────────────────

  function renderLevels(type, levels) {
    const tbody = document.getElementById(type + 'Levels');
    tbody.innerHTML = '';
    levels.forEach((row, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${row.label}</td>
        <td><input type="number" step="${type === 'pb' ? '0.1' : '1'}"
             value="${row.value}" min="0.1"
             oninput="updateLevel('${type}', ${i}, this.value)"></td>
        <td><button class="remove-btn" onclick="removeLevel('${type}', ${i})">✕</button></td>`;
      tbody.appendChild(tr);
    });
  }

  let pbLevels = DEFAULT_PB.map(r => ({ ...r }));
  let peLevels = DEFAULT_PE.map(r => ({ ...r }));

  renderLevels('pb', pbLevels);
  renderLevels('pe', peLevels);

  function updateLevel(type, idx, val) {
    (type === 'pb' ? pbLevels : peLevels)[idx].value = parseFloat(val) || 0;
  }

  function removeLevel(type, idx) {
    if (type === 'pb') pbLevels.splice(idx, 1);
    else peLevels.splice(idx, 1);
    renderLevels(type, type === 'pb' ? pbLevels : peLevels);
  }

  function addLevel(type) {
    const arr = type === 'pb' ? pbLevels : peLevels;
    const last = arr[arr.length - 1];
    const nextVal = last ? +(last.value + (type === 'pb' ? 0.5 : 5)).toFixed(1) : 1;
    const nextLabel = 'L' + (arr.length + 1);
    arr.push({ label: nextLabel, value: nextVal });
    renderLevels(type, arr);
  }

  function pctClass(pct) {
    if (pct < 0)   return 'pct-neg';
    if (pct < 20)  return 'pct-low';
    return 'pct-high';
  }

  function buildTable(levels, baseValue, currentPrice) {
    const rows = levels.map(row => {
      const target = +(baseValue * row.value).toFixed(2);
      const pct    = +((target / currentPrice - 1) * 100).toFixed(2);
      return { label: row.label, multiple: row.value, target, pct };
    });

    // find closest row to current price
    let closestIdx = 0;
    let minDiff = Infinity;
    rows.forEach((r, i) => {
      const d = Math.abs(r.target - currentPrice);
      if (d < minDiff) { minDiff = d; closestIdx = i; }
    });

    let html = `<table class="result-table">
      <thead><tr>
        <th>層級</th><th>倍數</th><th>目標價</th><th>相對現價%</th>
      </tr></thead><tbody>`;

    rows.forEach((r, i) => {
      const cls = i === closestIdx ? ' class="current-row"' : '';
      html += `<tr${cls}>
        <td>${r.label}</td>
        <td>${r.multiple}x</td>
        <td>${r.target.toFixed(2)}</td>
        <td class="${pctClass(r.pct)}">${r.pct >= 0 ? '+' : ''}${r.pct.toFixed(2)}%</td>
      </tr>`;
    });

    html += '</tbody></table>';
    return html;
  }

  function calculate() {
    const ticker = document.getElementById('ticker').value.trim() || '—';
    const name   = document.getElementById('stockName').value.trim() || '—';
    const price  = parseFloat(document.getElementById('currentPrice').value);
    const bvps   = parseFloat(document.getElementById('bvps').value);
    const eps    = parseFloat(document.getElementById('eps').value);

    if (!price || price <= 0) { alert('請輸入正確的現價'); return; }

    // P/B
    document.getElementById('res-ticker-pb').textContent = ticker;
    document.getElementById('res-name-pb').textContent   = name;
    if (bvps > 0) {
      document.getElementById('res-metric-pb').textContent = `P/B  |  每股淨值 ${bvps.toFixed(2)} 元`;
      document.getElementById('res-pb').innerHTML = buildTable(pbLevels, bvps, price);
    } else {
      document.getElementById('res-pb').innerHTML = '<p class="empty-msg">請輸入每股淨值 (BVPS)</p>';
    }

    // P/E
    document.getElementById('res-ticker-pe').textContent = ticker;
    document.getElementById('res-name-pe').textContent   = name;
    if (eps > 0) {
      document.getElementById('res-metric-pe').textContent = `P/E  |  EPS ${eps.toFixed(2)} 元`;
      document.getElementById('res-pe').innerHTML = buildTable(peLevels, eps, price);
    } else {
      document.getElementById('res-pe').innerHTML = '<p class="empty-msg">請輸入每股盈餘 (EPS)</p>';
    }
  }

  // ── 股票代號自動帶入 ─────────────────────
  let fetchTimer = null;
  const statusEl = document.getElementById('tickerStatus');

  document.getElementById('ticker').addEventListener('input', function () {
    clearTimeout(fetchTimer);
    const code = this.value.trim();
    statusEl.textContent = '';
    statusEl.className = 'ticker-status';
    if (code.length < 4) return;
    statusEl.textContent = '查詢中…';
    statusEl.className = 'ticker-status loading';
    fetchTimer = setTimeout(() => fetchStockInfo(code), 500);
  });

  async function fetchStockInfo(code) {
    for (const ex of ['tse', 'otc']) {
      try {
        const url = `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${ex}_${code}.tw&json=1&delay=0`;
        const res  = await fetch(url);
        const data = await res.json();
        const msg  = data.msgArray?.[0];
        if (!msg || !msg.n) continue;

        document.getElementById('stockName').value  = msg.n;
        // z = 即時成交價，非交易時間為 '-'，fallback 用 y (昨收)
        const price = (msg.z && msg.z !== '-') ? msg.z : msg.y;
        if (price && price !== '-') {
          document.getElementById('currentPrice').value = parseFloat(price).toFixed(2);
        }
        statusEl.textContent = '✓ ' + msg.n;
        statusEl.className = 'ticker-status ok';
        return;
      } catch (_) { /* ignore, try next */ }
    }
    statusEl.textContent = '找不到';
    statusEl.className = 'ticker-status error';
  }
  // ─────────────────────────────────────────

  // 頁面載入時自動計算一次
  calculate();
</script>
</body>
</html>
